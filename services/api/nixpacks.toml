[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --include-workspace-root"
]

[phases.build]
cmds = [
  "npm run build --workspace=packages/core",
  "npm run build --workspace=packages/agents",
  "npm run build --workspace=services/api"
]

[start]
cmd = "node services/api/dist/index.js"
