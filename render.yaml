services:
  - type: web
    name: carbonix-api
    env: node
    buildCommand: npm install && npx turbo run build --filter=api
    startCommand: npm run start --workspace=services/api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EMISSIONS_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USE_STATIC_GRID_DATA
        value: "false"
      - key: USE_MOCK_AGENTS
        value: "false"
      - key: CARBON_BUDGET_KG_DAY
        value: "10"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM_NAME
        value: "CarboniX Team"
