services:
  db:
    image: postgres:15-alpine
    container_name: carbonix-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: carbonix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: carbonix-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Ensure this matches your actual database setup:
      - DATABASE_URL=postgresql://postgres:password@db:5432/carbonix?schema=public
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: carbonix-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Ensure this matches your actual database setup:
      - DATABASE_URL=postgresql://postgres:password@db:5432/carbonix?schema=public
    depends_on:
      - db
      - api

volumes:
  postgres_data:
