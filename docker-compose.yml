services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: carbonix-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - EMISSIONS_API_KEY=${EMISSIONS_API_KEY}
      - USE_STATIC_GRID_DATA=${USE_STATIC_GRID_DATA}
    env_file:
      - services/api/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: carbonix-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - apps/web/.env
    depends_on:
      - api

volumes:
  postgres_data:
