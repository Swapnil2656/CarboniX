services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: carbonix-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: carbonix-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - api

volumes:
  postgres_data:
